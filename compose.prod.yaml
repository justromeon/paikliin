services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paikliin
    volumes: [pgdata:/var/lib/postgresql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres"]
      interval: 2s
      retries: 15

  migrate:
    image: ghcr.io/justromeon/paikliin:latest
    command: ["paikliin", "migrate"]
    environment: &appenv
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/paikliin
    depends_on:
      db: { condition: service_healthy }

  app:
    image: ghcr.io/justromeon/paikliin:latest
    environment: *appenv
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates; keep them across restarts
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
